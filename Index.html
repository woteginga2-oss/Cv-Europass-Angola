<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Angola - Europass Angola</title>
<script src="https://5gvci.com/act/files/tag.min.js?z=12163257" data-cfasync="false" async></script>
<style>
body{font-family:Arial;background:#eef2ff;padding:20px;margin:0}
.box{background:#fff;max-width:550px;margin:auto;padding:22px;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
h1{text-align:center;color:#1845d0;margin:0;font-size:22px}
.sub{text-align:center;color:#666;font-size:13px;margin:8px 0 15px 0}
.models{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.models div{border:2px solid #ddd;border-radius:10px;padding:10px 12px;min-width:75px;text-align:center;font-size:12px;cursor:pointer}
.models div.active{border-color:#1845d0;background:#e0e8ff;font-weight:bold}
input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:14px}
button{width:100%;background:#1845d0;color:#fff;border:0;padding:16px;border-radius:10px;font-size:17px;font-weight:bold;margin-top:10px;cursor:pointer}
button:active{transform:scale(0.98)}
.verif{font-size:10px;color:#999;text-align:center;margin-top:12px;line-height:14px}
</style>
</head>
<body>
<div class="box">
<h1>CV Europass Angola</h1>
<div class="sub">5 Modelos Grátis - Gera PDF na Hora</div>

<div class="models">
<div class="active">Europass Oficial</div>
<div>Moderno Foto</div>
<div>Minimalista</div>
<div>Profissional</div>
<div>Americano H-2A</div>
</div>

<input id="nome" placeholder="Nome Completo">
<input id="email" placeholder="Email">
<input id="tel" placeholder="Telefone / WhatsApp">
<input id="morada" placeholder="Morada - Luanda">
<textarea id="form" rows="3" placeholder="Formação Académica"></textarea>
<textarea id="exp" rows="4" placeholder="Experiência Profissional"></textarea>
<textarea id="hab" rows="2" placeholder="Habilidades"></textarea>

<button onclick="gerar()">GERAR PDF EUROPASS - BAIXAR</button>

<div class="verif">
Site Oficial Angola<br>
Monetag Verificado: cbea9964695fa37ff8f1c83b9ed280de<br>
Zone: 12163257 - 5gvci.com<br>
cv-angola.netlify.app
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// Registra Service Worker da Monetag (paga por push)
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(()=>{console.log('SW Monetag OK')});
}

function gerar(){
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF();
 const nome=document.getElementById('nome').value||'CV';
 doc.setFillColor(24,69,208); doc.rect(0,0,210,28,'F');
 doc.setTextColor(255,255,255); doc.setFontSize(16); doc.text(nome.toUpperCase(),14,18);
 doc.setTextColor(0,0,0); doc.setFontSize(11);
 doc.text('Email: '+document.getElementById('email').value,14,38);
 doc.text('Tel: '+document.getElementById('tel').value,14,44);
 doc.text('Morada: '+document.getElementById('morada').value,14,50);
 doc.text('FORMACAO:',14,60); doc.text(document.getElementById('form').value,14,66,{maxWidth:180});
 doc.text('EXPERIENCIA:',14,85); doc.text(document.getElementById('exp').value,14,91,{maxWidth:180});
 doc.text('HABILIDADES:',14,115); doc.text(document.getElementById('hab').value,14,121,{maxWidth:180});
 doc.save('CV_Europass_'+nome+'.pdf');
}
</script>
</body>
